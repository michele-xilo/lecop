[package]
name = "lecop"
version = "0.1.2"
edition = "2024"
description = "Fast health checks for LeRobot-format robot datasets (unofficial)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michele-xilo/lecop"
readme = "README.md"
keywords = ["lerobot", "robotics", "dataset", "validator", "parquet"]
categories = ["command-line-utilities", "science::robotics"]
exclude = [".claude", ".github", ".physlint", "assets/demo.gif", "assets/demo.tape"]

[features]
# The decoders are compiled in, but frames are only decoded when `--decode` is passed. Build with
# `--no-default-features` to leave them out.
default = ["decode"]
decode = ["dep:openh264", "dep:rav1d"]
# rav1d's hand-written assembly: AV1 decodes about 3x faster (Apple M-series, `c_so100_press_red_button`: 18 s against
# 67 s). Always on for aarch64 and for x86_64 Linux, Windows and macOS (see the target dependency below). On any other
# target it needs nasm installed, so it is off by default there and `cargo install lecop` works anywhere.
asm = ["decode", "rav1d?/asm"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
openh264 = { version = "0.9.9", optional = true }
parquet = { version = "60.1.0", features = ["arrow"] }
rav1d = { package = "lecop-rav1d", version = "1.3.0", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
toml = "1.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

# On these targets rav1d's assembly needs no nasm, so it is on whenever the decoder is: on ARM the C compiler the build
# already needs assembles it, and for x86_64 Linux, Windows and macOS `lecop-rav1d` ships it as prebuilt objects.
# Cargo merges these features into `rav1d` above only for these targets.
[target.'cfg(any(target_arch = "aarch64", all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows", target_os = "macos"))))'.dependencies]
rav1d = { package = "lecop-rav1d", version = "1.3.0", optional = true, default-features = false, features = ["asm"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# nasm-rs adds debug info to the openh264 assembly objects when DEBUG is set; on Windows MSVC those objects
# then fail to link in the dev profile (unresolved *_sse2 symbols).
[profile.dev.package.openh264-sys2]
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[bench]]
name = "mp4"
harness = false

[[bench]]
name = "validate"
harness = false

# `cargo binstall lecop` downloads the release binary (built with `asm`) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
