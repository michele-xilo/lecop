# Builds the lecop wheels (the binary packaged for pip/uvx) and publishes them to PyPI on a version tag.
# Publishing uses PyPI trusted publishing: no token is stored in this repository. Generated from
# `maturin generate-ci github` and trimmed to the platforms the GitHub release ships.
name: PyPI

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths: [pyproject.toml, Cargo.toml, .github/workflows/pypi.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, target: x86_64, manylinux: 2_28 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: 2_28 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # openh264's H.264 assembly is built with nasm on x86_64.
      - if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - if: runner.os == 'macOS'
        run: brew install nasm
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --features asm --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y nasm; elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y nasm; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv publish --trusted-publishing always dist/*
